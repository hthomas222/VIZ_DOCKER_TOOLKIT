name: Code Quality & Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  linting:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies & Linters
        run: |
          python -m pip install --upgrade pip
          pip install rich flask flake8 black

      - name: Check Formatting with Black
        run: |
          black --check .

      - name: Lint Code with Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  security:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install rich flask bandit pip-audit

      - name: Scan Code for Security Flaws (Bandit)
        run: |
          # B602/B603/B607 are skipped since subprocess calls are intentionally used for docker commands
          bandit -r . -sk B602,B603,B607 -ll

      - name: Audit Third-Party Dependencies (pip-audit)
        run: |
          pip-audit